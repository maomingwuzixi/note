<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR全流程台账管理系统</title>
  <!-- Element Plus 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase（完整版，修复兼容性） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.js"></script>
  <!-- Vue 3 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <!-- Element Plus -->
  <script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.js"></script>
  <!-- Excel导出 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app">
    <!-- 登录页面 -->
    <div v-if="!isLogin" class="flex justify-center items-center min-h-screen">
      <el-card shadow="hover" style="width: 400px;">
        <div class="text-center mb-6">
          <h2 class="text-xl font-bold text-blue-600">HR台账管理系统</h2>
        </div>
        <el-form :model="loginForm" :rules="loginRules" ref="loginFormRef" label-width="80px">
          <el-form-item label="账号" prop="username">
            <el-input v-model="loginForm.username" placeholder="请输入账号"></el-input>
          </el-form-item>
          <el-form-item label="密码" prop="password">
            <el-input v-model="loginForm.password" type="password" placeholder="请输入密码"></el-input>
          </el-form-item>
          <el-form-item>
            <el-button type="primary" @click="handleLogin" class="w-full" :loading="loading">登录</el-button>
          </el-form-item>
        </el-form>
      </el-card>
    </div>

    <!-- 主页面 -->
    <div v-if="isLogin" class="max-w-7xl mx-auto p-4 mt-4">
      <!-- 顶部导航 -->
      <el-menu :default-active="activeTab" mode="horizontal" background-color="#fff" text-color="#333" active-text-color="#409eff" class="mb-6">
        <el-menu-item index="employee" @click="activeTab = 'employee'">员工档案台账</el-menu-item>
        <el-menu-item index="recruit" @click="activeTab = 'recruit'">招聘管理台账</el-menu-item>
        <el-menu-item index="training" @click="activeTab = 'training'">培训记录台账</el-menu-item>
        <el-menu-item index="logout" @click="handleLogout" class="ml-auto">退出登录</el-menu-item>
      </el-menu>

      <!-- 员工档案台账 -->
      <div v-show="activeTab === 'employee'">
        <el-card shadow="hover">
          <template #header>
            <div class="flex justify-between items-center">
              <span class="text-lg font-bold">员工档案台账</span>
              <div>
                <el-input v-model="employeeSearch" placeholder="搜索姓名/身份证/部门" style="width: 300px;" @input="handleEmployeeSearch" clearable class="mr-2"></el-input>
                <el-button type="primary" @click="openEmployeeModal">新增员工</el-button>
                <el-button type="success" @click="exportEmployeeExcel" class="ml-2">导出Excel</el-button>
              </div>
            </div>
          </template>

          <el-table :data="employeeList" border stripe :loading="tableLoading" style="width: 100%;">
            <el-table-column prop="name" label="姓名" min-width="100"></el-table-column>
            <el-table-column prop="id_card" label="身份证号" min-width="180"></el-table-column>
            <el-table-column prop="department" label="部门" min-width="120"></el-table-column>
            <el-table-column prop="position" label="职位" min-width="120"></el-table-column>
            <el-table-column prop="phone" label="手机号" min-width="130"></el-table-column>
            <el-table-column prop="email" label="邮箱" min-width="200"></el-table-column>
            <el-table-column prop="entry_date" label="入职日期" min-width="120"></el-table-column>
            <el-table-column prop="status" label="状态" min-width="100">
              <template #default="scope">
                <el-tag :type="scope.row.status === '在职' ? 'success' : (scope.row.status === '试用期' ? 'warning' : 'danger')">
                  {{ scope.row.status }}
                </el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作" min-width="180">
              <template #default="scope">
                <el-button type="primary" size="small" @click="editEmployee(scope.row)">编辑</el-button>
                <el-button type="danger" size="small" @click="deleteEmployee(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>

          <el-pagination 
            @size-change="handleEmployeeSizeChange"
            @current-change="handleEmployeeCurrentChange"
            :current-page="employeePage.current"
            :page-sizes="[10, 20, 50]"
            :page-size="employeePage.size"
            layout="total, sizes, prev, pager, next, jumper"
            :total="employeeTotal"
            class="mt-4 flex justify-center"
          >
          </el-pagination>
        </el-card>
      </div>

      <!-- 招聘管理台账 -->
      <div v-show="activeTab === 'recruit'">
        <el-card shadow="hover">
          <template #header>
            <div class="flex justify-between items-center">
              <span class="text-lg font-bold">招聘管理台账</span>
              <div>
                <el-input v-model="recruitSearch" placeholder="搜索姓名/应聘职位/手机号" style="width: 300px;" @input="handleRecruitSearch" clearable class="mr-2"></el-input>
                <el-button type="primary" @click="openRecruitModal">新增候选人</el-button>
                <el-button type="success" @click="exportRecruitExcel" class="ml-2">导出Excel</el-button>
              </div>
            </div>
          </template>

          <el-table :data="recruitList" border stripe :loading="tableLoading" style="width: 100%;">
            <el-table-column prop="name" label="候选人姓名" min-width="100"></el-table-column>
            <el-table-column prop="position" label="应聘职位" min-width="120"></el-table-column>
            <el-table-column prop="phone" label="手机号" min-width="130"></el-table-column>
            <el-table-column prop="email" label="邮箱" min-width="200"></el-table-column>
            <el-table-column prop="education" label="学历" min-width="100"></el-table-column>
            <el-table-column prop="work_years" label="工作年限" min-width="100"></el-table-column>
            <el-table-column prop="interview_date" label="面试日期" min-width="120"></el-table-column>
            <el-table-column prop="status" label="状态" min-width="100">
              <template #default="scope">
                <el-tag :type="getStatusTagType(scope.row.status)">
                  {{ scope.row.status }}
                </el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作" min-width="180">
              <template #default="scope">
                <el-button type="primary" size="small" @click="editRecruit(scope.row)">编辑</el-button>
                <el-button type="danger" size="small" @click="deleteRecruit(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>

          <el-pagination 
            @size-change="handleRecruitSizeChange"
            @current-change="handleRecruitCurrentChange"
            :current-page="recruitPage.current"
            :page-sizes="[10, 20, 50]"
            :page-size="recruitPage.size"
            layout="total, sizes, prev, pager, next, jumper"
            :total="recruitTotal"
            class="mt-4 flex justify-center"
          >
          </el-pagination>
        </el-card>
      </div>

      <!-- 培训记录台账 -->
      <div v-show="activeTab === 'training'">
        <el-card shadow="hover">
          <template #header>
            <div class="flex justify-between items-center">
              <span class="text-lg font-bold">培训记录台账</span>
              <div>
                <el-input v-model="trainingSearch" placeholder="搜索员工姓名/课程名称" style="width: 300px;" @input="handleTrainingSearch" clearable class="mr-2"></el-input>
                <el-button type="primary" @click="openTrainingModal">新增培训记录</el-button>
                <el-button type="success" @click="exportTrainingExcel" class="ml-2">导出Excel</el-button>
              </div>
            </div>
          </template>

          <el-table :data="trainingList" border stripe :loading="tableLoading" style="width: 100%;">
            <el-table-column prop="employee_name" label="员工姓名" min-width="100"></el-table-column>
            <el-table-column prop="course_name" label="课程名称" min-width="150"></el-table-column>
            <el-table-column prop="training_date" label="培训日期" min-width="120"></el-table-column>
            <el-table-column prop="attendance" label="考勤状态" min-width="100">
              <template #default="scope">
                <el-tag :type="scope.row.attendance === '出勤' ? 'success' : 'danger'">
                  {{ scope.row.attendance }}
                </el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="score" label="考核成绩" min-width="100"></el-table-column>
            <el-table-column prop="certificate" label="证书编号" min-width="150"></el-table-column>
            <el-table-column prop="trainer" label="培训师" min-width="120"></el-table-column>
            <el-table-column label="操作" min-width="180">
              <template #default="scope">
                <el-button type="primary" size="small" @click="editTraining(scope.row)">编辑</el-button>
                <el-button type="danger" size="small" @click="deleteTraining(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>

          <el-pagination 
            @size-change="handleTrainingSizeChange"
            @current-change="handleTrainingCurrentChange"
            :current-page="trainingPage.current"
            :page-sizes="[10, 20, 50]"
            :page-size="trainingPage.size"
            layout="total, sizes, prev, pager, next, jumper"
            :total="trainingTotal"
            class="mt-4 flex justify-center"
          >
          </el-pagination>
        </el-card>
      </div>

      <!-- 员工编辑弹窗 -->
      <el-dialog v-model="employeeModalVisible" :title="employeeModalTitle" width="600px">
        <el-form :model="employeeForm" :rules="employeeRules" ref="employeeFormRef" label-width="100px">
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="姓名" prop="name">
                <el-input v-model="employeeForm.name" placeholder="请输入员工姓名"></el-input>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="身份证号" prop="id_card">
                <el-input v-model="employeeForm.id_card" placeholder="请输入身份证号"></el-input>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="部门" prop="department">
                <el-input v-model="employeeForm.department" placeholder="请输入所属部门"></el-input>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="职位" prop="position">
                <el-input v-model="employeeForm.position" placeholder="请输入职位"></el-input>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="手机号" prop="phone">
                <el-input v-model="employeeForm.phone" placeholder="请输入手机号"></el-input>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="邮箱" prop="email">
                <el-input v-model="employeeForm.email" placeholder="请输入邮箱"></el-input>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="入职日期" prop="entry_date">
                <el-date-picker v-model="employeeForm.entry_date" type="date" placeholder="请选择入职日期" style="width: 100%;"></el-date-picker>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="员工状态" prop="status">
                <el-select v-model="employeeForm.status" placeholder="请选择员工状态">
                  <el-option label="在职" value="在职"></el-option>
                  <el-option label="离职" value="离职"></el-option>
                  <el-option label="试用期" value="试用期"></el-option>
                </el-select>
              </el-form-item>
            </el-col>
          </el-row>
          <el-form-item label="备注">
            <el-input v-model="employeeForm.remark" type="textarea" :rows="3" placeholder="请输入备注信息"></el-input>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="employeeModalVisible = false">取消</el-button>
          <el-button type="primary" @click="saveEmployee">保存</el-button>
        </template>
      </el-dialog>

      <!-- 招聘编辑弹窗 -->
      <el-dialog v-model="recruitModalVisible" :title="recruitModalTitle" width="600px">
        <el-form :model="recruitForm" :rules="recruitRules" ref="recruitFormRef" label-width="100px">
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="姓名" prop="name">
                <el-input v-model="recruitForm.name" placeholder="请输入候选人姓名"></el-input>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="应聘职位" prop="position">
                <el-input v-model="recruitForm.position" placeholder="请输入应聘职位"></el-input>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="手机号" prop="phone">
                <el-input v-model="recruitForm.phone" placeholder="请输入手机号"></el-input>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="邮箱" prop="email">
                <el-input v-model="recruitForm.email" placeholder="请输入邮箱"></el-input>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="学历" prop="education">
                <el-select v-model="recruitForm.education" placeholder="请选择学历">
                  <el-option label="高中/中专" value="高中/中专"></el-option>
                  <el-option label="大专" value="大专"></el-option>
                  <el-option label="本科" value="本科"></el-option>
                  <el-option label="硕士" value="硕士"></el-option>
                  <el-option label="博士" value="博士"></el-option>
                </el-select>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="工作年限" prop="work_years">
                <el-select v-model="recruitForm.work_years" placeholder="请选择工作年限">
                  <el-option label="应届毕业生" value="应届毕业生"></el-option>
                  <el-option label="1年以内" value="1年以内"></el-option>
                  <el-option label="1-3年" value="1-3年"></el-option>
                  <el-option label="3-5年" value="3-5年"></el-option>
                  <el-option label="5-10年" value="5-10年"></el-option>
                  <el-option label="10年以上" value="10年以上"></el-option>
                </el-select>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="面试日期" prop="interview_date">
                <el-date-picker v-model="recruitForm.interview_date" type="date" placeholder="请选择面试日期" style="width: 100%;"></el-date-picker>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="状态" prop="status">
                <el-select v-model="recruitForm.status" placeholder="请选择状态">
                  <el-option label="待面试" value="待面试"></el-option>
                  <el-option label="面试中" value="面试中"></el-option>
                  <el-option label="已录用" value="已录用"></el-option>
                  <el-option label="已拒绝" value="已拒绝"></el-option>
                  <el-option label="已放弃" value="已放弃"></el-option>
                </el-select>
              </el-form-item>
            </el-col>
          </el-row>
          <el-form-item label="备注">
            <el-input v-model="recruitForm.remark" type="textarea" :rows="3" placeholder="请输入备注信息"></el-input>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="recruitModalVisible = false">取消</el-button>
          <el-button type="primary" @click="saveRecruit">保存</el-button>
        </template>
      </el-dialog>

      <!-- 培训记录编辑弹窗 -->
      <el-dialog v-model="trainingModalVisible" :title="trainingModalTitle" width="600px">
        <el-form :model="trainingForm" :rules="trainingRules" ref="trainingFormRef" label-width="100px">
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="员工姓名" prop="employee_name">
                <el-input v-model="trainingForm.employee_name" placeholder="请输入员工姓名"></el-input>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="课程名称" prop="course_name">
                <el-input v-model="trainingForm.course_name" placeholder="请输入课程名称"></el-input>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="培训日期" prop="training_date">
                <el-date-picker v-model="trainingForm.training_date" type="date" placeholder="请选择培训日期" style="width: 100%;"></el-date-picker>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="考勤状态" prop="attendance">
                <el-select v-model="trainingForm.attendance" placeholder="请选择考勤状态">
                  <el-option label="出勤" value="出勤"></el-option>
                  <el-option label="缺勤" value="缺勤"></el-option>
                  <el-option label="迟到" value="迟到"></el-option>
                  <el-option label="早退" value="早退"></el-option>
                </el-select>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="20">
            <el-col :span="12">
              <el-form-item label="考核成绩" prop="score">
                <el-input v-model="trainingForm.score" type="number" placeholder="请输入考核成绩" min="0" max="100"></el-input>
              </el-form-item>
            </el-col>
            <el-col :span="12">
              <el-form-item label="证书编号" prop="certificate">
                <el-input v-model="trainingForm.certificate" placeholder="请输入证书编号"></el-input>
              </el-form-item>
            </el-col>
          </el-row>
          <el-form-item label="培训师">
            <el-input v-model="trainingForm.trainer" placeholder="请输入培训师姓名"></el-input>
          </el-form-item>
          <el-form-item label="备注">
            <el-input v-model="trainingForm.remark" type="textarea" :rows="3" placeholder="请输入备注信息"></el-input>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="trainingModalVisible = false">取消</el-button>
          <el-button type="primary" @click="saveTraining">保存</el-button>
        </template>
      </el-dialog>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    createApp({
      setup() {
        // ========== 关键配置：已填入正确的Supabase信息 ==========
        const supabaseUrl = 'https://fgscptvyyxhqkbpriukq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnc2NwdHZ5eXhocWticHJpdWtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NDg4NDEsImV4cCI6MjA4OTIyNDg0MX0.else3hnnFpVh3j2wfS7vY4ku9xneQ5mh9sEcVUjrH5s';
        
        // 初始化Supabase客户端（修复406错误的核心配置）
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, {
          auth: {
            persistSession: false, // 关闭会话持久化，避免鉴权冲突
            autoRefreshToken: false
          },
          global: {
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            }
          }
        });

        // 基础状态
        const isLogin = ref(false);
        const loading = ref(false);
        const tableLoading = ref(false);
        const activeTab = ref('employee');

        // 登录表单
        const loginForm = reactive({
          username: 'admin',
          password: '123456'
        });
        const loginRules = reactive({
          username: [{ required: true, message: '请输入账号', trigger: 'blur' }],
          password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
        });
        const loginFormRef = ref(null);

        // 员工档案相关
        const employeeList = ref([]);
        const employeeSearch = ref('');
        const employeeTotal = ref(0);
        const employeePage = reactive({ current: 1, size: 10 });
        const employeeModalVisible = ref(false);
        const employeeModalTitle = ref('新增员工');
        const employeeForm = reactive({});
        const employeeRules = reactive({
          name: [{ required: true, message: '请输入姓名', trigger: 'blur' }],
          id_card: [{ required: true, message: '请输入身份证号', trigger: 'blur' }],
          department: [{ required: true, message: '请输入部门', trigger: 'blur' }],
          phone: [{ pattern: /^1[3-9]\d{9}$/, message: '请输入正确的手机号', trigger: 'blur' }],
          email: [{ type: 'email', message: '请输入正确的邮箱格式', trigger: 'blur' }]
        });
        const employeeFormRef = ref(null);

        // 招聘相关
        const recruitList = ref([]);
        const recruitSearch = ref('');
        const recruitTotal = ref(0);
        const recruitPage = reactive({ current: 1, size: 10 });
        const recruitModalVisible = ref(false);
        const recruitModalTitle = ref('新增候选人');
        const recruitForm = reactive({});
        const recruitRules = reactive({
          name: [{ required: true, message: '请输入姓名', trigger: 'blur' }],
          position: [{ required: true, message: '请输入应聘职位', trigger: 'blur' }]
        });
        const recruitFormRef = ref(null);

        // 培训记录相关
        const trainingList = ref([]);
        const trainingSearch = ref('');
        const trainingTotal = ref(0);
        const trainingPage = reactive({ current: 1, size: 10 });
        const trainingModalVisible = ref(false);
        const trainingModalTitle = ref('新增培训记录');
        const trainingForm = reactive({});
        const trainingRules = reactive({
          employee_name: [{ required: true, message: '请输入员工姓名', trigger: 'blur' }],
          course_name: [{ required: true, message: '请输入课程名称', trigger: 'blur' }]
        });
        const trainingFormRef = ref(null);

        // ========== 核心修复：登录逻辑（解决406错误） ==========
        const handleLogin = async () => {
          try {
            loading.value = true;
            
            // 简单表单验证
            if (!loginForm.username || !loginForm.password) {
              ElMessage.error('账号和密码不能为空！');
              loading.value = false;
              return;
            }

            // 修复查询方式：避免URL编码问题
            const username = loginForm.username.trim();
            const password = loginForm.password.trim();
            
            const { data: user, error } = await supabase
              .from('users')
              .select('*')
              .eq('username', username)
              .eq('password', password)
              .limit(1);

            // 调试信息（F12查看）
            console.log('登录查询结果：', user, '错误：', error);
            
            if (error) {
              ElMessage.error('登录失败：' + error.message);
              return;
            }
            
            if (!user || user.length === 0) {
              ElMessage.error('账号或密码错误！');
              return;
            }

            // 登录成功
            isLogin.value = true;
            ElMessage.success('登录成功！');
            
            // 加载数据
            loadEmployeeList();
            loadRecruitList();
            loadTrainingList();
            
          } catch (err) {
            ElMessage.error('登录异常：' + (err.message || err));
          } finally {
            loading.value = false;
          }
        };

        // 退出登录
        const handleLogout = () => {
          isLogin.value = false;
          ElMessage.info('已退出登录');
        };

        // ========== 员工档案管理 ==========
        const loadEmployeeList = async () => {
          try {
            tableLoading.value = true;
            
            let query = supabase.from('employees').select('*', { count: 'exact' });
            
            if (employeeSearch.value) {
              const search = employeeSearch.value.trim();
              query = query.or(`name.ilike.%${search}%,id_card.ilike.%${search}%,department.ilike.%${search}%`);
            }
            
            query = query.range(
              (employeePage.current - 1) * employeePage.size,
              employeePage.current * employeePage.size - 1
            ).order('created_at', { ascending: false });
            
            const { data, count, error } = await query;

            if (error) throw error;
            
            employeeList.value = data || [];
            employeeTotal.value = count || 0;
            
          } catch (err) {
            ElMessage.error('加载员工数据失败：' + err.message);
            console.error(err);
          } finally {
            tableLoading.value = false;
          }
        };

        const openEmployeeModal = () => {
          employeeModalTitle.value = '新增员工';
          employeeForm.name = '';
          employeeForm.id_card = '';
          employeeForm.department = '';
          employeeForm.position = '';
          employeeForm.phone = '';
          employeeForm.email = '';
          employeeForm.entry_date = new Date().toISOString().split('T')[0];
          employeeForm.status = '在职';
          employeeForm.remark = '';
          employeeModalVisible.value = true;
        };

        const editEmployee = (row) => {
          employeeModalTitle.value = '编辑员工';
          Object.assign(employeeForm, row);
          employeeModalVisible.value = true;
        };

        const saveEmployee = async () => {
          try {
            tableLoading.value = true;
            
            await employeeFormRef.value.validate();
            
            if (employeeForm.id) {
              // 编辑
              const { error } = await supabase
                .from('employees')
                .update({
                  name: employeeForm.name,
                  id_card: employeeForm.id_card,
                  department: employeeForm.department,
                  position: employeeForm.position,
                  phone: employeeForm.phone,
                  email: employeeForm.email,
                  entry_date: employeeForm.entry_date,
                  status: employeeForm.status,
                  remark: employeeForm.remark
                })
                .eq('id', employeeForm.id);
              
              if (error) throw error;
              ElMessage.success('员工信息编辑成功！');
            } else {
              // 新增
              const { error } = await supabase
                .from('employees')
                .insert([{
                  name: employeeForm.name,
                  id_card: employeeForm.id_card,
                  department: employeeForm.department,
                  position: employeeForm.position,
                  phone: employeeForm.phone,
                  email: employeeForm.email,
                  entry_date: employeeForm.entry_date,
                  status: employeeForm.status,
                  remark: employeeForm.remark
                }]);
              
              if (error) throw error;
              ElMessage.success('员工信息新增成功！');
            }
            
            employeeModalVisible.value = false;
            loadEmployeeList();
            
          } catch (err) {
            if (err.name !== 'ValidationError') {
              ElMessage.error('保存失败：' + err.message);
            }
          } finally {
            tableLoading.value = false;
          }
        };

        const deleteEmployee = async (id) => {
          try {
            await ElMessageBox.confirm(
              '此操作将永久删除该员工信息, 是否继续?',
              '提示',
              {
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                type: 'warning'
              }
            );
            
            const { error } = await supabase
              .from('employees')
              .delete()
              .eq('id', id);
            
            if (error) throw error;
            
            ElMessage.success('删除成功！');
            loadEmployeeList();
            
          } catch (err) {
            if (err !== 'cancel') {
              ElMessage.error('删除失败：' + err.message);
            }
          }
        };

        const exportEmployeeExcel = () => {
          try {
            if (employeeList.value.length === 0) {
              ElMessage.warning('暂无数据可导出');
              return;
            }
            
            const exportData = employeeList.value.map(item => ({
              '姓名': item.name,
              '身份证号': item.id_card,
              '部门': item.department,
              '职位': item.position || '',
              '手机号': item.phone || '',
              '邮箱': item.email || '',
              '入职日期': item.entry_date || '',
              '状态': item.status || '',
              '备注': item.remark || ''
            }));
            
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '员工档案');
            
            XLSX.writeFile(wb, `员工档案台账_${new Date().toLocaleDateString()}.xlsx`);
            ElMessage.success('Excel导出成功！');
            
          } catch (err) {
            ElMessage.error('导出失败：' + err.message);
          }
        };

        // ========== 招聘管理 ==========
        const loadRecruitList = async () => {
          try {
            tableLoading.value = true;
            
            let query = supabase.from('recruitment').select('*', { count: 'exact' });
            
            if (recruitSearch.value) {
              const search = recruitSearch.value.trim();
              query = query.or(`name.ilike.%${search}%,position.ilike.%${search}%,phone.ilike.%${search}%`);
            }
            
            query = query.range(
              (recruitPage.current - 1) * recruitPage.size,
              recruitPage.current * recruitPage.size - 1
            ).order('created_at', { ascending: false });
            
            const { data, count, error } = await query;

            if (error) throw error;
            
            recruitList.value = data || [];
            recruitTotal.value = count || 0;
            
          } catch (err) {
            ElMessage.error('加载招聘数据失败：' + err.message);
            console.error(err);
          } finally {
            tableLoading.value = false;
          }
        };

        const getStatusTagType = (status) => {
          const typeMap = {
            '待面试': 'info',
            '面试中': 'warning',
            '已录用': 'success',
            '已拒绝': 'danger',
            '已放弃': 'gray'
          };
          return typeMap[status] || 'info';
        };

        const openRecruitModal = () => {
          recruitModalTitle.value = '新增候选人';
          recruitForm.name = '';
          recruitForm.position = '';
          recruitForm.phone = '';
          recruitForm.email = '';
          recruitForm.education = '';
          recruitForm.work_years = '';
          recruitForm.interview_date = new Date().toISOString().split('T')[0];
          recruitForm.status = '待面试';
          recruitForm.remark = '';
          recruitModalVisible.value = true;
        };

        const editRecruit = (row) => {
          recruitModalTitle.value = '编辑候选人';
          Object.assign(recruitForm, row);
          recruitModalVisible.value = true;
        };

        const saveRecruit = async () => {
          try {
            tableLoading.value = true;
            
            await recruitFormRef.value.validate();
            
            if (recruitForm.id) {
              // 编辑
              const { error } = await supabase
                .from('recruitment')
                .update({
                  name: recruitForm.name,
                  position: recruitForm.position,
                  phone: recruitForm.phone,
                  email: recruitForm.email,
                  education: recruitForm.education,
                  work_years: recruitForm.work_years,
                  interview_date: recruitForm.interview_date,
                  status: recruitForm.status,
                  remark: recruitForm.remark
                })
                .eq('id', recruitForm.id);
              
              if (error) throw error;
              ElMessage.success('候选人信息编辑成功！');
            } else {
              // 新增
              const { error } = await supabase
                .from('recruitment')
                .insert([{
                  name: recruitForm.name,
                  position: recruitForm.position,
                  phone: recruitForm.phone,
                  email: recruitForm.email,
                  education: recruitForm.education,
                  work_years: recruitForm.work_years,
                  interview_date: recruitForm.interview_date,
                  status: recruitForm.status,
                  remark: recruitForm.remark
                }]);
              
              if (error) throw error;
              ElMessage.success('候选人信息新增成功！');
            }
            
            recruitModalVisible.value = false;
            loadRecruitList();
            
          } catch (err) {
            if (err.name !== 'ValidationError') {
              ElMessage.error('保存失败：' + err.message);
            }
          } finally {
            tableLoading.value = false;
          }
        };

        const deleteRecruit = async (id) => {
          try {
            await ElMessageBox.confirm(
              '此操作将永久删除该候选人信息, 是否继续?',
              '提示',
              {
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                type: 'warning'
              }
            );
            
            const { error } = await supabase
              .from('recruitment')
              .delete()
              .eq('id', id);
            
            if (error) throw error;
            
            ElMessage.success('删除成功！');
            loadRecruitList();
            
          } catch (err) {
            if (err !== 'cancel') {
              ElMessage.error('删除失败：' + err.message);
            }
          }
        };

        const exportRecruitExcel = () => {
          try {
            if (recruitList.value.length === 0) {
              ElMessage.warning('暂无数据可导出');
              return;
            }
            
            const exportData = recruitList.value.map(item => ({
              '候选人姓名': item.name,
              '应聘职位': item.position,
              '手机号': item.phone || '',
              '邮箱': item.email || '',
              '学历': item.education || '',
              '工作年限': item.work_years || '',
              '面试日期': item.interview_date || '',
              '状态': item.status || '',
              '备注': item.remark || ''
            }));
            
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '招聘台账');
            
            XLSX.writeFile(wb, `招聘管理台账_${new Date().toLocaleDateString()}.xlsx`);
            ElMessage.success('Excel导出成功！');
            
          } catch (err) {
            ElMessage.error('导出失败：' + err.message);
          }
        };

        // ========== 培训记录管理 ==========
        const loadTrainingList = async () => {
          try {
            tableLoading.value = true;
            
            let query = supabase.from('training_records').select('*', { count: 'exact' });
            
            if (trainingSearch.value) {
              const search = trainingSearch.value.trim();
              query = query.or(`employee_name.ilike.%${search}%,course_name.ilike.%${search}%`);
            }
            
            query = query.range(
              (trainingPage.current - 1) * trainingPage.size,
              trainingPage.current * trainingPage.size - 1
            ).order('training_date', { ascending: false });
            
            const { data, count, error } = await query;

            if (error) throw error;
            
            trainingList.value = data || [];
            trainingTotal.value = count || 0;
            
          } catch (err) {
            ElMessage.error('加载培训记录失败：' + err.message);
            console.error(err);
          } finally {
            tableLoading.value = false;
          }
        };

        const openTrainingModal = () => {
          trainingModalTitle.value = '新增培训记录';
          trainingForm.employee_name = '';
          trainingForm.course_name = '';
          trainingForm.training_date = new Date().toISOString().split('T')[0];
          trainingForm.attendance = '出勤';
          trainingForm.score = '';
          trainingForm.certificate = '';
          trainingForm.trainer = '';
          trainingForm.remark = '';
          trainingModalVisible.value = true;
        };

        const editTraining = (row) => {
          trainingModalTitle.value = '编辑培训记录';
          Object.assign(trainingForm, row);
          trainingModalVisible.value = true;
        };

        const saveTraining = async () => {
          try {
            tableLoading.value = true;
            
            await trainingFormRef.value.validate();
            
            if (trainingForm.id) {
              // 编辑
              const { error } = await supabase
                .from('training_records')
                .update({
                  employee_name: trainingForm.employee_name,
                  course_name: trainingForm.course_name,
                  training_date: trainingForm.training_date,
                  attendance: trainingForm.attendance,
                  score: trainingForm.score,
                  certificate: trainingForm.certificate,
                  trainer: trainingForm.trainer,
                  remark: trainingForm.remark
                })
                .eq('id', trainingForm.id);
              
              if (error) throw error;
              ElMessage.success('培训记录编辑成功！');
            } else {
              // 新增
              const { error } = await supabase
                .from('training_records')
                .insert([{
                  employee_name: trainingForm.employee_name,
                  course_name: trainingForm.course_name,
                  training_date: trainingForm.training_date,
                  attendance: trainingForm.attendance,
                  score: trainingForm.score,
                  certificate: trainingForm.certificate,
                  trainer: trainingForm.trainer,
                  remark: trainingForm.remark
                }]);
              
              if (error) throw error;
              ElMessage.success('培训记录新增成功！');
            }
            
            trainingModalVisible.value = false;
            loadTrainingList();
            
          } catch (err) {
            if (err.name !== 'ValidationError') {
              ElMessage.error('保存失败：' + err.message);
            }
          } finally {
            tableLoading.value = false;
          }
        };

        const deleteTraining = async (id) => {
          try {
            await ElMessageBox.confirm(
              '此操作将永久删除该培训记录, 是否继续?',
              '提示',
              {
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                type: 'warning'
              }
            );
            
            const { error } = await supabase
              .from('training_records')
              .delete()
              .eq('id', id);
            
            if (error) throw error;
            
            ElMessage.success('删除成功！');
            loadTrainingList();
            
          } catch (err) {
            if (err !== 'cancel') {
              ElMessage.error('删除失败：' + err.message);
            }
          }
        };

        const exportTrainingExcel = () => {
          try {
            if (trainingList.value.length === 0) {
              ElMessage.warning('暂无数据可导出');
              return;
            }
            
            const exportData = trainingList.value.map(item => ({
              '员工姓名': item.employee_name,
              '课程名称': item.course_name,
              '培训日期': item.training_date || '',
              '考勤状态': item.attendance || '',
              '考核成绩': item.score || '',
              '证书编号': item.certificate || '',
              '培训师': item.trainer || ''
            }));
            
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '培训记录');
            
            XLSX.writeFile(wb, `培训记录台账_${new Date().toLocaleDateString()}.xlsx`);
            ElMessage.success('Excel导出成功！');
            
          } catch (err) {
            ElMessage.error('导出失败：' + err.message);
          }
        };

        // ========== 分页处理 ==========
        const handleEmployeeSizeChange = (val) => {
          employeePage.size = val;
          loadEmployeeList();
        };
        
        const handleEmployeeCurrentChange = (val) => {
          employeePage.current = val;
          loadEmployeeList();
        };
        
        const handleRecruitSizeChange = (val) => {
          recruitPage.size = val;
          loadRecruitList();
        };
        
        const handleRecruitCurrentChange = (val) => {
          recruitPage.current = val;
          loadRecruitList();
        };
        
        const handleTrainingSizeChange = (val) => {
          trainingPage.size = val;
          loadTrainingList();
        };
        
        const handleTrainingCurrentChange = (val) => {
          trainingPage.current = val;
          loadTrainingList();
        };

        // ========== 搜索处理 ==========
        const handleEmployeeSearch = () => {
          employeePage.current = 1;
          loadEmployeeList();
        };
        
        const handleRecruitSearch = () => {
          recruitPage.current = 1;
          loadRecruitList();
        };
        
        const handleTrainingSearch = () => {
          trainingPage.current = 1;
          loadTrainingList();
        };

        // 初始化
        onMounted(() => {
          console.log('✅ 系统初始化完成，Supabase客户端已创建');
        });

        return {
          isLogin,
          loading,
          tableLoading,
          activeTab,
          loginForm,
          loginRules,
          loginFormRef,
          employeeList,
          employeeSearch,
          employeeTotal,
          employeePage,
          employeeModalVisible,
          employeeModalTitle,
          employeeForm,
          employeeRules,
          employeeFormRef,
          recruitList,
          recruitSearch,
          recruitTotal,
          recruitPage,
          recruitModalVisible,
          recruitModalTitle,
          recruitForm,
          recruitRules,
          recruitFormRef,
          trainingList,
          trainingSearch,
          trainingTotal,
          trainingPage,
          trainingModalVisible,
          trainingModalTitle,
          trainingForm,
          trainingRules,
          trainingFormRef,
          handleLogin,
          handleLogout,
          loadEmployeeList,
          openEmployeeModal,
          editEmployee,
          saveEmployee,
          deleteEmployee,
          exportEmployeeExcel,
          loadRecruitList,
          getStatusTagType,
          openRecruitModal,
          editRecruit,
          saveRecruit,
          deleteRecruit,
          exportRecruitExcel,
          loadTrainingList,
          openTrainingModal,
          editTraining,
          saveTraining,
          deleteTraining,
          exportTrainingExcel,
          handleEmployeeSizeChange,
          handleEmployeeCurrentChange,
          handleRecruitSizeChange,
          handleRecruitCurrentChange,
          handleTrainingSizeChange,
          handleTrainingCurrentChange,
          handleEmployeeSearch,
          handleRecruitSearch,
          handleTrainingSearch
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
