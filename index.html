<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR台账管理系统（精简版）</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 登录 -->
    <div v-if="!isLogin" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
      <el-card shadow="hover" style="width: 400px;">
        <h2 style="text-align: center; color: #409eff; margin-bottom: 20px;">HR台账管理系统</h2>
        <el-form :model="loginForm" :rules="loginRules" ref="loginFormRef" label-width="80px">
          <el-form-item label="账号" prop="username"><el-input v-model="loginForm.username"></el-input></el-form-item>
          <el-form-item label="密码" prop="password"><el-input v-model="loginForm.password" type="password"></el-input></el-form-item>
          <el-form-item><el-button type="primary" @click="handleLogin" style="width: 100%;" :loading="loading">登录</el-button></el-form-item>
        </el-form>
      </el-card>
    </div>

    <!-- 主界面 -->
    <div v-if="isLogin" class="container">
      <!-- 导航 -->
      <el-menu :default-active="activeTab" mode="horizontal" style="margin-bottom: 20px;">
        <el-menu-item index="employee">员工档案</el-menu-item>
        <el-menu-item index="recruit">招聘台账</el-menu-item>
        <el-menu-item index="training">培训记录</el-menu-item>
        <el-menu-item index="logout" @click="isLogin=false" style="margin-left: auto;">退出</el-menu-item>
      </el-menu>

      <!-- 员工档案 -->
      <div v-show="activeTab === 'employee'">
        <el-card>
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span style="font-weight: bold;">员工档案台账</span>
            <div>
              <el-input v-model="employeeSearch" placeholder="搜索姓名/身份证" style="width: 200px; margin-right: 10px;" clearable @input="loadEmployeeList"></el-input>
              <el-button type="primary" @click="openEmpModal">新增</el-button>
              <el-button type="success" @click="exportEmpExcel">导出</el-button>
            </div>
          </div>
          <el-table :data="employeeList" border stripe :loading="loading">
            <el-table-column prop="name" label="姓名"></el-table-column>
            <el-table-column prop="id_card" label="身份证号"></el-table-column>
            <el-table-column prop="department" label="部门"></el-table-column>
            <el-table-column label="操作">
              <template #default="scope">
                <el-button size="small" type="primary" @click="editEmp(scope.row)">编辑</el-button>
                <el-button size="small" type="danger" @click="delEmp(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
          <el-pagination @size-change="(val)=>{empPage.size=val;loadEmployeeList()}" @current-change="(val)=>{empPage.current=val;loadEmployeeList()}" 
            :current-page="empPage.current" :page-size="empPage.size" layout="total, sizes, prev, pager, next, jumper" :total="empTotal" style="margin-top: 10px; text-align: center;">
          </el-pagination>
        </el-card>
      </div>

      <!-- 招聘台账 -->
      <div v-show="activeTab === 'recruit'">
        <el-card>
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span style="font-weight: bold;">招聘管理台账</span>
            <div>
              <el-input v-model="recruitSearch" placeholder="搜索姓名/职位" style="width: 200px; margin-right: 10px;" clearable @input="loadRecruitList"></el-input>
              <el-button type="primary" @click="openRecModal">新增</el-button>
              <el-button type="success" @click="exportRecExcel">导出</el-button>
            </div>
          </div>
          <el-table :data="recruitList" border stripe :loading="loading">
            <el-table-column prop="name" label="姓名"></el-table-column>
            <el-table-column prop="position" label="应聘职位"></el-table-column>
            <el-table-column prop="phone" label="手机号"></el-table-column>
            <el-table-column label="操作">
              <template #default="scope">
                <el-button size="small" type="primary" @click="editRec(scope.row)">编辑</el-button>
                <el-button size="small" type="danger" @click="delRec(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
          <el-pagination @size-change="(val)=>{recPage.size=val;loadRecruitList()}" @current-change="(val)=>{recPage.current=val;loadRecruitList()}" 
            :current-page="recPage.current" :page-size="recPage.size" layout="total, sizes, prev, pager, next, jumper" :total="recTotal" style="margin-top: 10px; text-align: center;">
          </el-pagination>
        </el-card>
      </div>

      <!-- 培训记录 -->
      <div v-show="activeTab === 'training'">
        <el-card>
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span style="font-weight: bold;">培训记录台账</span>
            <div>
              <el-input v-model="trainSearch" placeholder="搜索员工ID/课程ID" style="width: 200px; margin-right: 10px;" clearable @input="loadTrainList"></el-input>
              <el-button type="primary" @click="openTrainModal">新增</el-button>
              <el-button type="success" @click="exportTrainExcel">导出</el-button>
            </div>
          </div>
          <el-table :data="trainList" border stripe :loading="loading">
            <el-table-column prop="employee_id" label="员工ID"></el-table-column>
            <el-table-column prop="course_id" label="课程ID"></el-table-column>
            <el-table-column prop="attendance" label="考勤状态">
              <template #default="scope"><el-tag :type="scope.row.attendance==='出勤'?'success':'danger'">{{scope.row.attendance}}</el-tag></template>
            </el-table-column>
            <el-table-column label="操作">
              <template #default="scope">
                <el-button size="small" type="primary" @click="editTrain(scope.row)">编辑</el-button>
                <el-button size="small" type="danger" @click="delTrain(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
          <el-pagination @size-change="(val)=>{trainPage.size=val;loadTrainList()}" @current-change="(val)=>{trainPage.current=val;loadTrainList()}" 
            :current-page="trainPage.current" :page-size="trainPage.size" layout="total, sizes, prev, pager, next, jumper" :total="trainTotal" style="margin-top: 10px; text-align: center;">
          </el-pagination>
        </el-card>
      </div>

      <!-- 员工弹窗 -->
      <el-dialog v-model="empModalShow" :title="empModalTitle" width="400px">
        <el-form :model="empForm" :rules="empRules" ref="empFormRef" label-width="80px">
          <el-form-item label="姓名" prop="name"><el-input v-model="empForm.name"></el-input></el-form-item>
          <el-form-item label="身份证" prop="id_card"><el-input v-model="empForm.id_card"></el-input></el-form-item>
          <el-form-item label="部门" prop="department"><el-input v-model="empForm.department"></el-input></el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="empModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveEmp">保存</el-button>
        </template>
      </el-dialog>

      <!-- 招聘弹窗 -->
      <el-dialog v-model="recModalShow" :title="recModalTitle" width="400px">
        <el-form :model="recForm" :rules="recRules" ref="recFormRef" label-width="80px">
          <el-form-item label="姓名" prop="name"><el-input v-model="recForm.name"></el-input></el-form-item>
          <el-form-item label="职位" prop="position"><el-input v-model="recForm.position"></el-input></el-form-item>
          <el-form-item label="手机号" prop="phone"><el-input v-model="recForm.phone"></el-input></el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="recModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveRec">保存</el-button>
        </template>
      </el-dialog>

      <!-- 培训弹窗 -->
      <el-dialog v-model="trainModalShow" :title="trainModalTitle" width="400px">
        <el-form :model="trainForm" :rules="trainRules" ref="trainFormRef" label-width="80px">
          <el-form-item label="员工ID" prop="employee_id"><el-input v-model="trainForm.employee_id"></el-input></el-form-item>
          <el-form-item label="课程ID" prop="course_id"><el-input v-model="trainForm.course_id"></el-input></el-form-item>
          <el-form-item label="考勤" prop="attendance">
            <el-select v-model="trainForm.attendance"><el-option label="出勤" value="出勤"></el-option><el-option label="缺勤" value="缺勤"></el-option></el-select>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="trainModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveTrain">保存</el-button>
        </template>
      </el-dialog>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    createApp({
      setup() {
        // Supabase初始化
        const supabase = window.supabase.createClient(
          'https://fgscptvyyxhqkbpriukq.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnc2NwdHZ5eXhocWticHJpdWtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NDg4NDEsImV4cCI6MjA4OTIyNDg0MX0.else3hnnFpVh3j2wfS7vY4ku9xneQ5mh9sEcVUjrH5s',
          { global: { fetch: (url, opt) => fetch(url.replace(/\?columns=.*$/, ''), opt) } }
        );

        // 基础状态
        const isLogin = ref(false);
        const loading = ref(false);
        const activeTab = ref('employee');

        // 登录
        const loginForm = reactive({ username: 'admin', password: '123456' });
        const loginRules = reactive({
          username: [{ required: true, message: '请输入账号' }],
          password: [{ required: true, message: '请输入密码' }]
        });
        const loginFormRef = ref(null);
const handleLogin = async () => {
  try {
    loading.value = true;
    await loginFormRef.value.validate();
    if (loginForm.username === 'admin' && loginForm.password === '123456') {
      isLogin.value = true;
      ElMessage.success('登录成功');
      // 增加延迟加载，确保Supabase数据已同步
      setTimeout(() => {
        loadEmployeeList(); 
        loadRecruitList(); 
        loadTrainList();
      }, 500);
    } else ElMessage.error('账号密码错误');
  } catch (e) { ElMessage.error('登录失败'); } finally { loading.value = false; }
};

        // 员工档案
        const employeeList = ref([]);
        const employeeSearch = ref('');
        const empPage = reactive({ current: 1, size: 10 });
        const empTotal = ref(0);
        const empModalShow = ref(false);
        const empModalTitle = ref('新增员工');
        const empForm = reactive({ id: '', name: '', id_card: '', department: '' });
        const empRules = reactive({
          name: [{ required: true, message: '请输入姓名' }],
          id_card: [{ required: true, message: '请输入身份证' }],
          department: [{ required: true, message: '请输入部门' }]
        });
        const empFormRef = ref(null);

        const loadEmployeeList = async () => {
          loading.value = true;
          let q = supabase.from('employees').select('*', { count: 'exact' });
          if (employeeSearch.value) q = q.or(`name.ilike.%${employeeSearch.value}%,id_card.ilike.%${employeeSearch.value}%`);
          q = q.range((empPage.current-1)*empPage.size, empPage.current*empPage.size-1);
          const { data, count, error } = await q;
          if (error) ElMessage.error('加载失败：' + error.message);
          else { employeeList.value = data || []; empTotal.value = count || 0; }
          loading.value = false;
        };

        const openEmpModal = () => { empModalTitle.value = '新增员工'; empForm.id = ''; empForm.name = ''; empForm.id_card = ''; empForm.department = ''; empModalShow.value = true; };
        const editEmp = (row) => { empModalTitle.value = '编辑员工'; Object.assign(empForm, row); empModalShow.value = true; };
        const saveEmp = async () => {
          await empFormRef.value.validate();
          const { error } = empForm.id 
            ? await supabase.from('employees').update(empForm).eq('id', empForm.id)
            : await supabase.from('employees').insert([empForm]);
          if (error) ElMessage.error('保存失败：' + error.message);
          else { ElMessage.success('保存成功'); empModalShow.value = false; loadEmployeeList(); }
        };
        const delEmp = async (id) => {
          await ElMessageBox.confirm('确定删除？');
          const { error } = await supabase.from('employees').delete().eq('id', id);
          if (error) ElMessage.error('删除失败：' + error.message);
          else { ElMessage.success('删除成功'); loadEmployeeList(); }
        };
        const exportEmpExcel = () => {
          if (!employeeList.value.length) return ElMessage.warning('暂无数据');
          const ws = XLSX.utils.json_to_sheet(employeeList.value.map(i=>({姓名:i.name,身份证号:i.id_card,部门:i.department})));
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, '员工档案');
          XLSX.writeFile(wb, `员工档案_${new Date().toLocaleDateString()}.xlsx`);
        };

        // 招聘台账
        const recruitList = ref([]);
        const recruitSearch = ref('');
        const recPage = reactive({ current: 1, size: 10 });
        const recTotal = ref(0);
        const recModalShow = ref(false);
        const recModalTitle = ref('新增候选人');
        const recForm = reactive({ id: '', name: '', position: '', phone: '' });
        const recRules = reactive({
          name: [{ required: true, message: '请输入姓名' }],
          position: [{ required: true, message: '请输入职位' }]
        });
        const recFormRef = ref(null);

        const loadRecruitList = async () => {
          loading.value = true;
          let q = supabase.from('recruitment').select('*', { count: 'exact' });
          if (recruitSearch.value) q = q.or(`name.ilike.%${recruitSearch.value}%,position.ilike.%${recruitSearch.value}%`);
          q = q.range((recPage.current-1)*recPage.size, recPage.current*recPage.size-1);
          const { data, count, error } = await q;
          if (error) ElMessage.error('加载失败：' + error.message);
          else { recruitList.value = data || []; recTotal.value = count || 0; }
          loading.value = false;
        };

        const openRecModal = () => { recModalTitle.value = '新增候选人'; recForm.id = ''; recForm.name = ''; recForm.position = ''; recForm.phone = ''; recModalShow.value = true; };
        const editRec = (row) => { recModalTitle.value = '编辑候选人'; Object.assign(recForm, row); recModalShow.value = true; };
        const saveRec = async () => {
          await recFormRef.value.validate();
          const { error } = recForm.id 
            ? await supabase.from('recruitment').update(recForm).eq('id', recForm.id)
            : await supabase.from('recruitment').insert([recForm]);
          if (error) ElMessage.error('保存失败：' + error.message);
          else { ElMessage.success('保存成功'); recModalShow.value = false; loadRecruitList(); }
        };
        const delRec = async (id) => {
          await ElMessageBox.confirm('确定删除？');
          const { error } = await supabase.from('recruitment').delete().eq('id', id);
          if (error) ElMessage.error('删除失败：' + error.message);
          else { ElMessage.success('删除成功'); loadRecruitList(); }
        };
        const exportRecExcel = () => {
          if (!recruitList.value.length) return ElMessage.warning('暂无数据');
          const ws = XLSX.utils.json_to_sheet(recruitList.value.map(i=>({姓名:i.name,应聘职位:i.position,手机号:i.phone})));
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, '招聘台账');
          XLSX.writeFile(wb, `招聘台账_${new Date().toLocaleDateString()}.xlsx`);
        };

        // 培训记录
        const trainList = ref([]);
        const trainSearch = ref('');
        const trainPage = reactive({ current: 1, size: 10 });
        const trainTotal = ref(0);
        const trainModalShow = ref(false);
        const trainModalTitle = ref('新增培训记录');
        const trainForm = reactive({ id: '', employee_id: '', course_id: '', attendance: '出勤' });
        const trainRules = reactive({
          employee_id: [{ required: true, message: '请输入员工ID' }],
          course_id: [{ required: true, message: '请输入课程ID' }]
        });
        const trainFormRef = ref(null);

        const loadTrainList = async () => {
          loading.value = true;
          let q = supabase.from('training_records').select('*', { count: 'exact' });
          if (trainSearch.value) q = q.or(`employee_id.ilike.%${trainSearch.value}%,course_id.ilike.%${trainSearch.value}%`);
          q = q.range((trainPage.current-1)*trainPage.size, trainPage.current*trainPage.size-1);
          const { data, count, error } = await q;
          if (error) ElMessage.error('加载失败：' + error.message);
          else { trainList.value = data || []; trainTotal.value = count || 0; }
          loading.value = false;
        };

        const openTrainModal = () => { trainModalTitle.value = '新增培训记录'; trainForm.id = ''; trainForm.employee_id = ''; trainForm.course_id = ''; trainForm.attendance = '出勤'; trainModalShow.value = true; };
        const editTrain = (row) => { trainModalTitle.value = '编辑培训记录'; Object.assign(trainForm, row); trainModalShow.value = true; };
        const saveTrain = async () => {
          await trainFormRef.value.validate();
          const { error } = trainForm.id 
            ? await supabase.from('training_records').update(trainForm).eq('id', trainForm.id)
            : await supabase.from('training_records').insert([trainForm]);
          if (error) ElMessage.error('保存失败：' + error.message);
          else { ElMessage.success('保存成功'); trainModalShow.value = false; loadTrainList(); }
        };
        const delTrain = async (id) => {
          await ElMessageBox.confirm('确定删除？');
          const { error } = await supabase.from('training_records').delete().eq('id', id);
          if (error) ElMessage.error('删除失败：' + error.message);
          else { ElMessage.success('删除成功'); loadTrainList(); }
        };
        const exportTrainExcel = () => {
          if (!trainList.value.length) return ElMessage.warning('暂无数据');
          const ws = XLSX.utils.json_to_sheet(trainList.value.map(i=>({员工ID:i.employee_id,课程ID:i.course_id,考勤状态:i.attendance})));
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, '培训记录');
          XLSX.writeFile(wb, `培训记录_${new Date().toLocaleDateString()}.xlsx`);
        };

        return {
          isLogin, loading, activeTab,
          loginForm, loginRules, loginFormRef, handleLogin,
          employeeList, employeeSearch, empPage, empTotal, empModalShow, empModalTitle, empForm, empRules, empFormRef,
          loadEmployeeList, openEmpModal, editEmp, saveEmp, delEmp, exportEmpExcel,
          recruitList, recruitSearch, recPage, recTotal, recModalShow, recModalTitle, recForm, recRules, recFormRef,
          loadRecruitList, openRecModal, editRec, saveRec, delRec, exportRecExcel,
          trainList, trainSearch, trainPage, trainTotal, trainModalShow, trainModalTitle, trainForm, trainRules, trainFormRef,
          loadTrainList, openTrainModal, editTrain, saveTrain, delTrain, exportTrainExcel
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
