<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR台账管理系统</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.38.4/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
    .el-upload { display: inline-block; margin-left: 10px; }
    .button-group { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="app">
    <div v-if="!isLogin" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
      <el-card shadow="hover" style="width: 400px;">
        <h2 style="text-align: center; color: #409eff; margin-bottom: 20px;">HR台账管理系统</h2>
        <el-form :model="loginForm" :rules="loginRules" ref="loginFormRef" label-width="80px">
          <el-form-item label="账号" prop="username">
            <el-input v-model="loginForm.username" placeholder="请输入账号"></el-input>
          </el-form-item>
          <el-form-item label="密码" prop="password">
            <el-input v-model="loginForm.password" type="password" placeholder="请输入密码"></el-input>
          </el-form-item>
          <el-form-item>
            <el-button type="primary" @click="handleLogin" style="width: 100%;" :loading="loading">登录</el-button>
          </el-form-item>
        </el-form>
      </el-card>
    </div>

    <div v-if="isLogin" class="container">
      <el-menu 
        :default-active="activeTab" 
        mode="horizontal" 
        background-color="#fff" 
        text-color="#333" 
        active-text-color="#409eff" 
        style="margin-bottom: 20px;"
        @select="handleTabChange"
      >
        <el-menu-item index="employee">员工档案</el-menu-item>
        <el-menu-item index="recruit">招聘台账</el-menu-item>
        <el-menu-item index="training">培训记录</el-menu-item>
        <el-menu-item index="logout" style="margin-left: auto;">退出登录</el-menu-item>
      </el-menu>

      <!-- 员工档案 -->
      <div v-show="activeTab === 'employee'">
        <el-card shadow="hover">
          <template #header>
            <div class="button-group">
              <span style="font-size: 16px; font-weight: bold;">员工档案台账</span>
              <div style="float: right;">
                <el-input v-model="employeeSearch" placeholder="搜索姓名/身份证" style="width: 200px; margin-right: 10px;" clearable @input="loadEmployeeList"></el-input>
                <el-button type="primary" @click="openEmpModal">新增</el-button>
                <el-button type="warning" @click="batchEditEmp" :disabled="selectedEmpRows.length === 0">批量编辑</el-button>
                <el-button type="danger" @click="batchDelEmp" :disabled="selectedEmpRows.length === 0">批量删除</el-button>
                <el-button type="success" @click="exportEmpExcel">导出Excel</el-button>
                <el-button type="info" @click="exportEmpExcelTemplate">导出模板</el-button>
                <el-upload
                  class="upload-demo"
                  action="#"
                  :auto-upload="false"
                  :on-change="importEmpExcel"
                  accept=".xlsx,.xls"
                >
                  <el-button type="info">导入Excel</el-button>
                </el-upload>
              </div>
            </div>
          </template>

          <el-table 
            :data="employeeList" 
            border 
            stripe 
            :loading="loading" 
            style="width: 100%;"
            @selection-change="val => selectedEmpRows = val"
            ref="employeeTable"
          >
            <el-table-column type="selection" min-width="50"></el-table-column>
            <el-table-column prop="name" label="姓名" min-width="100"></el-table-column>
            <el-table-column prop="id_card" label="身份证号" min-width="180"></el-table-column>
            <el-table-column prop="department" label="部门" min-width="120"></el-table-column>
            <el-table-column prop="entry_date" label="入职日期" min-width="120">
              <template #default="scope">
                {{ scope.row.entry_date ? scope.row.entry_date.split('T')[0] : '-' }}
              </template>
            </el-table-column>
            <el-table-column label="操作" min-width="180">
              <template #default="scope">
                <el-button type="primary" size="small" @click="editEmp(scope.row)">编辑</el-button>
                <el-button type="danger" size="small" @click="delEmp(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>

          <el-pagination 
            @size-change="(val)=>{empPage.size=val;loadEmployeeList()}"
            @current-change="(val)=>{empPage.current=val;loadEmployeeList()}"
            :current-page="empPage.current"
            :page-sizes="[10, 20, 50]"
            :page-size="empPage.size"
            layout="total, sizes, prev, pager, next, jumper"
            :total="empTotal"
            style="margin-top: 20px; text-align: center;"
          >
          </el-pagination>
        </el-card>
      </div>

      <!-- 员工编辑弹窗 -->
      <el-dialog v-model="empModalShow" :title="empModalTitle" width="400px">
        <el-form :model="empForm" :rules="empRules" ref="empFormRef" label-width="80px">
          <el-form-item label="姓名" prop="name">
            <el-input v-model="empForm.name" placeholder="请输入员工姓名"></el-input>
          </el-form-item>
          <el-form-item label="身份证号" prop="id_card">
            <el-input v-model="empForm.id_card" placeholder="请输入身份证号"></el-input>
          </el-form-item>
          <el-form-item label="部门" prop="department">
            <el-input v-model="empForm.department" placeholder="请输入所属部门"></el-input>
          </el-form-item>
          <el-form-item label="入职日期" prop="entry_date">
            <el-date-picker v-model="empForm.entry_date" type="date" placeholder="请选择入职日期"></el-date-picker>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="empModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveEmp">保存</el-button>
        </template>
      </el-dialog>

      <!-- 员工批量编辑 -->
      <el-dialog v-model="batchEmpModalShow" title="批量编辑员工档案" width="400px">
        <el-form :model="batchEmpForm" ref="batchEmpFormRef" label-width="80px">
          <el-form-item label="部门">
            <el-input v-model="batchEmpForm.department" placeholder="批量修改部门"></el-input>
          </el-form-item>
          <el-form-item label="入职日期">
            <el-date-picker v-model="batchEmpForm.entry_date" type="date" placeholder="批量修改入职日期"></el-date-picker>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="batchEmpModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveBatchEmp">保存修改</el-button>
        </template>
      </el-dialog>

      <!-- 招聘台账 -->
      <div v-show="activeTab === 'recruit'">
        <el-card shadow="hover">
          <template #header>
            <div class="button-group">
              <span style="font-size: 16px; font-weight: bold;">招聘管理台账</span>
              <div style="float: right;">
                <el-input v-model="recruitSearch" placeholder="搜索姓名/应聘职位" style="width: 200px; margin-right: 10px;" clearable @input="loadRecruitList"></el-input>
                <el-button type="primary" @click="openRecModal">新增</el-button>
                <el-button type="warning" @click="batchEditRec" :disabled="selectedRecRows.length === 0">批量编辑</el-button>
                <el-button type="danger" @click="batchDelRec" :disabled="selectedRecRows.length === 0">批量删除</el-button>
                <el-button type="success" @click="exportRecExcel">导出Excel</el-button>
                <el-button type="info" @click="exportRecExcelTemplate">导出模板</el-button>
                <el-upload
                  class="upload-demo"
                  action="#"
                  :auto-upload="false"
                  :on-change="importRecExcel"
                  accept=".xlsx,.xls"
                >
                  <el-button type="info">导入Excel</el-button>
                </el-upload>
              </div>
            </div>
          </template>

          <el-table 
            :data="recruitList" 
            border 
            stripe 
            :loading="loading" 
            style="width: 100%;"
            @selection-change="val => selectedRecRows = val"
            ref="recruitTable"
          >
            <el-table-column type="selection" min-width="50"></el-table-column>
            <el-table-column prop="name" label="候选人姓名" min-width="100"></el-table-column>
            <el-table-column prop="position" label="应聘职位" min-width="120"></el-table-column>
            <el-table-column prop="phone" label="手机号" min-width="130"></el-table-column>
            <el-table-column prop="interview_date" label="面试时间" min-width="120">
              <template #default="scope">
                {{ scope.row.interview_date ? scope.row.interview_date.split('T')[0] : '-' }}
              </template>
            </el-table-column>
            <el-table-column prop="expected_salary" label="薪资期望" min-width="100"></el-table-column>
            <el-table-column prop="recruit_status" label="招聘状态" min-width="100">
              <template #default="scope">
                <el-tag :type="scope.row.recruit_status === '已录用' ? 'success' : (scope.row.recruit_status === '面试中' ? 'warning' : 'info')">
                  {{ scope.row.recruit_status }}
                </el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作" min-width="180">
              <template #default="scope">
                <el-button type="primary" size="small" @click="editRec(scope.row)">编辑</el-button>
                <el-button type="danger" size="small" @click="delRec(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>

          <el-pagination 
            @size-change="(val)=>{recPage.size=val;loadRecruitList()}"
            @current-change="(val)=>{recPage.current=val;loadRecruitList()}"
            :current-page="recPage.current"
            :page-sizes="[10, 20, 50]"
            :page-size="recPage.size"
            layout="total, sizes, prev, pager, next, jumper"
            :total="recTotal"
            style="margin-top: 20px; text-align: center;"
          >
          </el-pagination>
        </el-card>
      </div>

      <!-- 招聘编辑弹窗 -->
      <el-dialog v-model="recModalShow" :title="recModalTitle" width="400px">
        <el-form :model="recForm" :rules="recRules" ref="recFormRef" label-width="80px">
          <el-form-item label="姓名" prop="name">
            <el-input v-model="recForm.name" placeholder="请输入候选人姓名"></el-input>
          </el-form-item>
          <el-form-item label="应聘职位" prop="position">
            <el-input v-model="recForm.position" placeholder="请输入应聘职位"></el-input>
          </el-form-item>
          <el-form-item label="手机号" prop="phone">
            <el-input v-model="recForm.phone" placeholder="请输入手机号"></el-input>
          </el-form-item>
          <el-form-item label="面试时间" prop="interview_date">
            <el-date-picker v-model="recForm.interview_date" type="date" placeholder="请选择面试时间"></el-date-picker>
          </el-form-item>
          <el-form-item label="薪资期望" prop="expected_salary">
            <el-input v-model.number="recForm.expected_salary" type="number" placeholder="请输入薪资期望"></el-input>
          </el-form-item>
          <el-form-item label="招聘状态" prop="recruit_status">
            <el-select v-model="recForm.recruit_status" placeholder="请选择招聘状态">
              <el-option label="待面试" value="待面试"></el-option>
              <el-option label="面试中" value="面试中"></el-option>
              <el-option label="已录用" value="已录用"></el-option>
              <el-option label="已淘汰" value="已淘汰"></el-option>
            </el-select>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="recModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveRec">保存</el-button>
        </template>
      </el-dialog>

      <!-- 招聘批量编辑 -->
      <el-dialog v-model="batchRecModalShow" title="批量编辑招聘记录" width="400px">
        <el-form :model="batchRecForm" ref="batchRecFormRef" label-width="80px">
          <el-form-item label="招聘状态">
            <el-select v-model="batchRecForm.recruit_status" placeholder="批量修改招聘状态">
              <el-option label="待面试" value="待面试"></el-option>
              <el-option label="面试中" value="面试中"></el-option>
              <el-option label="已录用" value="已录用"></el-option>
              <el-option label="已淘汰" value="已淘汰"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="面试时间">
            <el-date-picker v-model="batchRecForm.interview_date" type="date" placeholder="批量修改面试时间"></el-date-picker>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="batchRecModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveBatchRec">保存修改</el-button>
        </template>
      </el-dialog>

      <!-- 培训记录 -->
      <div v-show="activeTab === 'training'">
        <el-card shadow="hover">
          <template #header>
            <div class="button-group">
              <span style="font-size: 16px; font-weight: bold;">培训记录台账</span>
              <div style="float: right;">
                <el-input v-model="trainSearch" placeholder="搜索员工姓名/课程ID" style="width: 200px; margin-right: 10px;" clearable @input="loadTrainList"></el-input>
                <el-button type="primary" @click="openTrainModal">新增</el-button>
                <el-button type="warning" @click="batchEditTrain" :disabled="selectedTrainRows.length === 0">批量编辑</el-button>
                <el-button type="danger" @click="batchDelTrain" :disabled="selectedTrainRows.length === 0">批量删除</el-button>
                <el-button type="success" @click="exportTrainExcel">导出Excel</el-button>
                <el-button type="info" @click="exportTrainExcelTemplate">导出模板</el-button>
                <el-upload
                  class="upload-demo"
                  action="#"
                  :auto-upload="false"
                  :on-change="importTrainExcel"
                  accept=".xlsx,.xls"
                >
                  <el-button type="info">导入Excel</el-button>
                </el-upload>
              </div>
            </div>
          </template>

          <el-table 
            :data="trainList" 
            border 
            stripe 
            :loading="loading" 
            style="width: 100%;"
            @selection-change="val => selectedTrainRows = val"
            ref="trainingTable"
          >
            <el-table-column type="selection" min-width="50"></el-table-column>
            <el-table-column prop="employee_name" label="员工姓名" min-width="120"></el-table-column>
            <el-table-column prop="course_id" label="课程ID/名称" min-width="180"></el-table-column>
            <el-table-column prop="attendance" label="考勤状态" min-width="100">
              <template #default="scope">
                <el-tag :type="scope.row.attendance === '出勤' ? 'success' : (scope.row.attendance === '迟到' ? 'warning' : 'danger')">
                  {{ scope.row.attendance }}
                </el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="training_hours" label="培训时长(小时)" min-width="120"></el-table-column>
            <el-table-column prop="training_type" label="培训类型" min-width="120">
              <template #default="scope">
                <el-tag type="info">{{ scope.row.training_type }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作" min-width="180">
              <template #default="scope">
                <el-button type="primary" size="small" @click="editTrain(scope.row)">编辑</el-button>
                <el-button type="danger" size="small" @click="delTrain(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>

          <el-pagination 
            @size-change="(val)=>{trainPage.size=val;loadTrainList()}"
            @current-change="(val)=>{trainPage.current=val;loadTrainList()}"
            :current-page="trainPage.current"
            :page-sizes="[10, 20, 50]"
            :page-size="trainPage.size"
            layout="total, sizes, prev, pager, next, jumper"
            :total="trainTotal"
            style="margin-top: 20px; text-align: center;"
          >
          </el-pagination>
        </el-card>
      </div>

      <!-- 培训编辑弹窗 -->
      <el-dialog v-model="trainModalShow" :title="trainModalTitle" width="400px">
        <el-form :model="trainForm" :rules="trainRules" ref="trainFormRef" label-width="80px">
          <el-form-item label="员工姓名" prop="employee_name">
            <el-select v-model="trainForm.employee_name" placeholder="请选择员工" @change="handleEmpNameChange">
              <el-option 
                v-for="emp in employeeList" 
                :key="emp.id" 
                :label="emp.name" 
                :value="emp.name"
              ></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="课程ID/名称" prop="course_id">
            <el-input v-model="trainForm.course_id" placeholder="如：TR001-前端进阶"></el-input>
          </el-form-item>
          <el-form-item label="考勤状态" prop="attendance">
            <el-select v-model="trainForm.attendance" placeholder="请选择考勤状态">
              <el-option label="出勤" value="出勤"></el-option>
              <el-option label="缺勤" value="缺勤"></el-option>
              <el-option label="迟到" value="迟到"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="培训时长(小时)" prop="training_hours">
            <el-input v-model.number="trainForm.training_hours" type="number" placeholder="请输入时长" min="0"></el-input>
          </el-form-item>
          <el-form-item label="培训类型" prop="training_type">
            <el-select v-model="trainForm.training_type" placeholder="请选择培训类型">
              <el-option label="内部培训" value="内部培训"></el-option>
              <el-option label="外部培训" value="外部培训"></el-option>
              <el-option label="线上培训" value="线上培训"></el-option>
            </el-select>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="trainModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveTrain">保存</el-button>
        </template>
      </el-dialog>

      <!-- 培训批量编辑 -->
      <el-dialog v-model="batchTrainModalShow" title="批量编辑培训记录" width="400px">
        <el-form :model="batchTrainForm" ref="batchTrainFormRef" label-width="80px">
          <el-form-item label="考勤状态">
            <el-select v-model="batchTrainForm.attendance" placeholder="请选择考勤状态">
              <el-option label="出勤" value="出勤"></el-option>
              <el-option label="缺勤" value="缺勤"></el-option>
              <el-option label="迟到" value="迟到"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="培训时长(小时)">
            <el-input v-model.number="batchTrainForm.training_hours" type="number" placeholder="批量修改时长" min="0"></el-input>
          </el-form-item>
          <el-form-item label="培训类型">
            <el-select v-model="batchTrainForm.training_type" placeholder="批量修改培训类型">
              <el-option label="内部培训" value="内部培训"></el-option>
              <el-option label="外部培训" value="外部培训"></el-option>
              <el-option label="线上培训" value="线上培训"></el-option>
            </el-select>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="batchTrainModalShow=false">取消</el-button>
          <el-button type="primary" @click="saveBatchTrain">保存修改</el-button>
        </template>
      </el-dialog>
    </div>
  </div>

  <script>
    // ========== Supabase 永久保活防休眠 心跳【全自动】 ==========
    const supabaseKeepAlive = window.supabase.createClient(
      'https://fgscptvyyxhqkbpriukq.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnc2NwdHZ5eXhocWticHJpdWtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NDg4NDEsImV4cCI6MjA4OTIyNDg0MX0.else3hnnFpVh3j2wfS7vY4ku9xneQ5mh9sEcVUjrH5s'
    );
    async function keepAlive() {
      try {
        await supabaseKeepAlive.from('employees').select('id').limit(1);
        console.log('✅ 保活心跳正常，项目已续命');
      } catch (e) {
        console.log('❌ 保活失败，项目需手动恢复');
      }
    }
    keepAlive();
    setInterval(keepAlive, 300000);
    // ========================================================

    const { createApp, ref, reactive } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    createApp({
      setup() {
        // 这里是你的 Supabase 配置
        const supabase = window.supabase.createClient(
          'https://fgscptvyyxhqkbpriukq.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnc2NwdHZ5eXhocWticHJpdWtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NDg4NDEsImV4cCI6MjA4OTIyNDg0MX0.else3hnnFpVh3j2wfS7vY4ku9xneQ5mh9sEcVUjrH5s'
        );

        const isLogin = ref(false);
        const loading = ref(false);
        const activeTab = ref('employee');

        // 登录表单：初始为空，无硬编码账号密码
        const loginForm = reactive({ username: '', password: '' });
        const loginRules = reactive({
          username: [{ required: true, message: '请输入账号', trigger: 'blur' }],
          password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
        });
        const loginFormRef = ref(null);

        // ===================== 员工模块 =====================
        const employeeList = ref([]);
        const employeeSearch = ref('');
        const empPage = reactive({ current: 1, size: 10 });
        const empTotal = ref(0);
        const selectedEmpRows = ref([]);
        
        const empModalShow = ref(false);
        const empModalTitle = ref('新增员工');
        const empForm = reactive({ id: '', name: '', id_card: '', department: '', entry_date: '' });
        const empRules = reactive({
          name: [{ required: true, message: '请输入姓名', trigger: 'blur' }],
          id_card: [{ required: true, message: '请输入身份证号', trigger: 'blur' }],
          department: [{ required: true, message: '请输入部门', trigger: 'blur' }]
        });
        const empFormRef = ref(null);

        const batchEmpModalShow = ref(false);
        const batchEmpForm = reactive({ department: '', entry_date: '' });

        const loadEmployeeList = async () => {
          loading.value = true;
          try {
            let query = supabase.from('employees').select('*', { count: 'exact' });
            if (employeeSearch.value) {
              const s = '%' + employeeSearch.value + '%';
              query = query.or('name.ilike.' + s + ',id_card.ilike.' + s);
            }
            const from = (empPage.current - 1) * empPage.size;
            const to = from + empPage.size - 1;
            const { data, count, error } = await query.range(from, to);
            if (error) throw error;
            employeeList.value = data || [];
            empTotal.value = count || 0;
          } catch (err) {
            ElMessage.error('加载失败：' + err.message);
          } finally {
            loading.value = false;
          }
        };

        const openEmpModal = () => {
          empModalTitle.value = '新增员工';
          Object.assign(empForm, { id: '', name: '', id_card: '', department: '', entry_date: '' });
          empModalShow.value = true;
        };

        const editEmp = (row) => {
          empModalTitle.value = '编辑员工';
          Object.assign(empForm, row);
          empForm.entry_date = row.entry_date?.split('T')[0] || '';
          empModalShow.value = true;
        };

        const saveEmp = async () => {
          try {
            await empFormRef.value.validate();
            const data = { name: empForm.name, id_card: empForm.id_card, department: empForm.department, entry_date: empForm.entry_date };
            if (empForm.id) {
              await supabase.from('employees').update(data).eq('id', empForm.id);
            } else {
              await supabase.from('employees').insert([data]);
            }
            ElMessage.success('保存成功');
            empModalShow.value = false;
            loadEmployeeList();
          } catch (err) {
            ElMessage.error('保存失败：' + err.message);
          }
        };

        const delEmp = async (id) => {
          try {
            await ElMessageBox.confirm('确定删除？', '提示', { type: 'warning' });
            await supabase.from('employees').delete().eq('id', id);
            ElMessage.success('删除成功');
            loadEmployeeList();
          } catch (err) {
            if (err !== 'cancel') ElMessage.error('删除失败');
          }
        };

        const batchEditEmp = () => { batchEmpModalShow.value = true; };
        const saveBatchEmp = async () => {
          try {
            const ids = selectedEmpRows.value.map(x => x.id);
            const up = {};
            if (batchEmpForm.department) up.department = batchEmpForm.department;
            if (batchEmpForm.entry_date) up.entry_date = batchEmpForm.entry_date;
            await supabase.from('employees').update(up).in('id', ids);
            ElMessage.success('批量修改成功');
            batchEmpModalShow.value = false;
            loadEmployeeList();
          } catch (err) { ElMessage.error('失败'); }
        };
        const batchDelEmp = async () => {
          try {
            await ElMessageBox.confirm('确定批量删除？');
            const ids = selectedEmpRows.value.map(x => x.id);
            await supabase.from('employees').delete().in('id', ids);
            ElMessage.success('删除成功');
            loadEmployeeList();
          } catch (err) {}
        };

        const exportEmpExcel = () => {
          const ws = XLSX.utils.json_to_sheet(employeeList.value.map(item => ({
            姓名: item.name, 身份证号: item.id_card, 部门: item.department, 入职日期: item.entry_date?.split('T')[0]
          })));
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, '员工');
          XLSX.writeFile(wb, '员工档案.xlsx');
          ElMessage.success('导出成功');
        };
        const exportEmpExcelTemplate = () => {
          const tmp = [{姓名:'张三',身份证号:'110101199001011234',部门:'技术部',入职日期:'2024-01-01'}];
          const ws = XLSX.utils.json_to_sheet(tmp);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, '模板');
          XLSX.writeFile(wb, '员工模板.xlsx');
        };
        const importEmpExcel = async (file) => {
          const r = new FileReader();
          r.onload = async e => {
            const wb = XLSX.read(e.target.result, { type: 'binary' });
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            const arr = data.map(x => ({
              name: x.姓名, id_card: x.身份证号, department: x.部门, entry_date: x.入职日期
            })).filter(x => x.name && x.id_card);
            await supabase.from('employees').insert(arr);
            ElMessage.success('导入成功');
            loadEmployeeList();
          };
          r.readAsBinaryString(file.raw);
        };

        // ===================== 招聘模块 =====================
        const recruitList = ref([]);
        const recruitSearch = ref('');
        const recPage = reactive({ current: 1, size: 10 });
        const recTotal = ref(0);
        const selectedRecRows = ref([]);
        
        const recModalShow = ref(false);
        const recModalTitle = ref('新增候选人');
        const recForm = reactive({ id: '', name: '', position: '', phone: '', interview_date: '', expected_salary: '', recruit_status: '待面试' });
        const recRules = reactive({
          name: [{ required: true }], position: [{ required: true }]
        });
        const recFormRef = ref(null);
        const batchRecModalShow = ref(false);
        const batchRecForm = reactive({ recruit_status: '', interview_date: '' });

        const loadRecruitList = async () => {
          loading.value = true;
          try {
            let q = supabase.from('recruitment').select('*', { count: 'exact' });
            if (recruitSearch.value) {
              const s = '%' + recruitSearch.value + '%';
              q = q.or('name.ilike.' + s + ',position.ilike.' + s);
            }
            const f = (recPage.current-1)*recPage.size, t = f+recPage.size-1;
            const { data, count } = await q.range(f,t);
            recruitList.value = data || [];
            recTotal.value = count || 0;
          } catch (err) {} finally { loading.value = false; }
        };

        const openRecModal = () => {
          recModalTitle.value = '新增候选人';
          Object.assign(recForm, { id:'', name:'', position:'', phone:'', interview_date:'', expected_salary:'', recruit_status:'待面试' });
          recModalShow.value = true;
        };
        const editRec = row => {
          recModalTitle.value = '编辑候选人';
          Object.assign(recForm, row);
          recForm.interview_date = row.interview_date?.split('T')[0] || '';
          recModalShow.value = true;
        };
        const saveRec = async () => {
          try {
            await recFormRef.value.validate();
            const d = { name: recForm.name, position: recForm.position, phone: recForm.phone, interview_date: recForm.interview_date, expected_salary: +recForm.expected_salary, recruit_status: recForm.recruit_status };
            if (recForm.id) await supabase.from('recruitment').update(d).eq('id', recForm.id);
            else await supabase.from('recruitment').insert([d]);
            ElMessage.success('保存成功');
            recModalShow.value = false;
            loadRecruitList();
          } catch (err) {}
        };
        const delRec = async id => {
          try {
            await ElMessageBox.confirm('确定删除？');
            await supabase.from('recruitment').delete().eq('id', id);
            ElMessage.success('删除成功');
            loadRecruitList();
          } catch (err) {}
        };
        const batchEditRec = () => { batchRecModalShow.value = true; };
        const saveBatchRec = async () => {
          const ids = selectedRecRows.value.map(x => x.id);
          const up = {};
          if (batchRecForm.recruit_status) up.recruit_status = batchRecForm.recruit_status;
          if (batchRecForm.interview_date) up.interview_date = batchRecForm.interview_date;
          await supabase.from('recruitment').update(up).in('id', ids);
          ElMessage.success('批量修改成功');
          batchRecModalShow.value = false;
          loadRecruitList();
        };
        const batchDelRec = async () => {
          await ElMessageBox.confirm('确定删除？');
          const ids = selectedRecRows.value.map(x => x.id);
          await supabase.from('recruitment').delete().in('id', ids);
          ElMessage.success('删除成功');
          loadRecruitList();
        };
        const exportRecExcel = () => {
          const ws = XLSX.utils.json_to_sheet(recruitList.value.map(x => ({
            姓名:x.name,应聘职位:x.position,手机号:x.phone,面试时间:x.interview_date?.split('T')[0],薪资期望:x.expected_salary,招聘状态:x.recruit_status
          })));
          const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'招聘'); XLSX.writeFile(wb,'招聘台账.xlsx'); ElMessage.success('导出成功');
        };
        const exportRecExcelTemplate = () => {
          const tmp = [{姓名:'赵六',应聘职位:'前端',手机号:'13800138000',面试时间:'2026-03-20',薪资期望:15000,招聘状态:'待面试'}];
          const ws = XLSX.utils.json_to_sheet(tmp); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'模板'); XLSX.writeFile(wb,'招聘模板.xlsx');
        };
        const importRecExcel = async file => {
          const r = new FileReader(); r.onload = async e=>{
            const wb = XLSX.read(e.target.result,{type:'binary'});
            const arr = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]).map(x=>({
              name:x.姓名, position:x.应聘职位, phone:x.手机号, interview_date:x.面试时间, expected_salary:+x.薪资期望||0, recruit_status:x.招聘状态||'待面试'
            })).filter(x=>x.name&&x.position);
            await supabase.from('recruitment').insert(arr); ElMessage.success('导入成功'); loadRecruitList();
          }; r.readAsBinaryString(file.raw);
        };

        // ===================== 培训模块 =====================
        const trainList = ref([]);
        const trainSearch = ref('');
        const trainPage = reactive({ current:1, size:10 });
        const trainTotal = ref(0);
        const selectedTrainRows = ref([]);
        
        const trainModalShow = ref(false);
        const trainModalTitle = ref('新增培训');
        const trainForm = reactive({ id:'', employee_id:'', employee_name:'', course_id:'', attendance:'出勤', training_hours:0, training_type:'内部培训' });
        const trainRules = reactive({ employee_name:[{required:true}], course_id:[{required:true}], training_hours:[{required:true}] });
        const trainFormRef = ref(null);
        const batchTrainModalShow = ref(false);
        const batchTrainForm = reactive({ attendance:'', training_hours:0, training_type:'' });

        const loadTrainList = async () => {
          loading.value = true;
          let q = supabase.from('training_records').select('*',{count:'exact'});
          if (trainSearch.value) { const s='%'+trainSearch.value+'%'; q=q.or('employee_name.ilike.'+s+',course_id.ilike.'+s); }
          const f=(trainPage.current-1)*trainPage.size, t=f+trainPage.size-1;
          const {data,count} = await q.range(f,t);
          trainList.value = data||[]; trainTotal.value=count||0;
          loading.value=false;
        };
        const handleEmpNameChange = () => {
          const emp = employeeList.value.find(e=>e.name===trainForm.employee_name);
          if (emp) trainForm.employee_id = emp.id;
        };
        const openTrainModal = () => {
          trainModalTitle.value='新增培训记录';
          Object.assign(trainForm,{id:'',employee_id:'',employee_name:'',course_id:'',attendance:'出勤',training_hours:0,training_type:'内部培训'});
          trainModalShow.value=true;
        };
        const editTrain = row => {
          trainModalTitle.value='编辑培训'; Object.assign(trainForm,row); trainModalShow.value=true;
        };
        const saveTrain = async () => {
          try {
            await trainFormRef.value.validate();
            if (!trainForm.employee_id) { const emp=employeeList.value.find(e=>e.name===trainForm.employee_name); if (emp) trainForm.employee_id=emp.id; }
            const d={employee_id:trainForm.employee_id,employee_name:trainForm.employee_name,course_id:trainForm.course_id,attendance:trainForm.attendance,training_hours:+trainForm.training_hours,training_type:trainForm.training_type};
            if (trainForm.id) await supabase.from('training_records').update(d).eq('id',trainForm.id);
            else await supabase.from('training_records').insert([d]);
            ElMessage.success('保存成功'); trainModalShow.value=false; loadTrainList();
          } catch(err){}
        };
        const delTrain = async id => {
          await ElMessageBox.confirm('确定删除？'); await supabase.from('training_records').delete().eq('id',id); ElMessage.success('删除成功'); loadTrainList();
        };
        const batchEditTrain = () => { batchTrainModalShow.value=true; };
        const saveBatchTrain = async () => {
          const ids=selectedTrainRows.value.map(x=>x.id); const up={};
          if (batchTrainForm.attendance) up.attendance=batchTrainForm.attendance;
          if (batchTrainForm.training_hours) up.training_hours=+batchTrainForm.training_hours;
          if (batchTrainForm.training_type) up.training_type=batchTrainForm.training_type;
          await supabase.from('training_records').update(up).in('id',ids);
          ElMessage.success('批量修改成功'); batchTrainModalShow.value=false; loadTrainList();
        };
        const batchDelTrain = async () => {
          await ElMessageBox.confirm('确定删除？'); const ids=selectedTrainRows.value.map(x=>x.id); await supabase.from('training_records').delete().in('id',ids); ElMessage.success('删除成功'); loadTrainList();
        };
        const exportTrainExcel = () => {
          const ws=XLSX.utils.json_to_sheet(trainList.value.map(x=>({
            员工姓名:x.employee_name,课程ID:x.course_id,考勤状态:x.attendance,培训时长:x.training_hours,培训类型:x.training_type
          }))); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'培训'); XLSX.writeFile(wb,'培训记录.xlsx'); ElMessage.success('导出成功');
        };
        const exportTrainExcelTemplate = () => {
          const tmp=[{员工姓名:'张三',课程ID:'TR001',考勤状态:'出勤',培训时长:8,培训类型:'内部培训'}];
          const ws=XLSX.utils.json_to_sheet(tmp); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'模板'); XLSX.writeFile(wb,'培训模板.xlsx');
        };
        const importTrainExcel = async file => {
          const r=new FileReader(); r.onload=async e=>{
            const wb=XLSX.read(e.target.result,{type:'binary'});
            const arr=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]).map(x=>{
              const emp=employeeList.value.find(e=>e.name===x.员工姓名);
              if (!emp) return null;
              return {employee_id:emp.id,employee_name:x.员工姓名,course_id:x.课程ID,attendance:x.考勤状态||'出勤',training_hours:+x.培训时长||0,training_type:x.培训类型||'内部培训'};
            }).filter(Boolean);
            await supabase.from('training_records').insert(arr); ElMessage.success('导入成功'); loadTrainList();
          }; r.readAsBinaryString(file.raw);
        };

        // ===================== 登录：查SQL表，无硬编码 =====================
        const handleLogin = async () => {
          try {
            loading.value = true;
            await loginFormRef.value.validate();
            const { data, error } = await supabase
              .from('system_users')
              .select('*')
              .eq('username', loginForm.username)
              .eq('password', loginForm.password)
              .single();
            if (error || !data) throw new Error('账号或密码错误');
            isLogin.value = true;
            ElMessage.success('登录成功');
            setTimeout(()=>{
              loadEmployeeList();
              loadRecruitList();
              loadTrainList();
            },500);
          } catch (err) {
            ElMessage.error(err.message);
          } finally {
            loading.value = false;
          }
        };

        const handleLogout = () => { isLogin.value = false; ElMessage.info('已退出'); };
        const handleTabChange = i => {
          activeTab.value = i;
          if(i==='employee') loadEmployeeList();
          if(i==='recruit') loadRecruitList();
          if(i==='training') loadTrainList();
          if(i==='logout') handleLogout();
        };

        return {
          isLogin, loading, activeTab,
          loginForm, loginRules, loginFormRef, handleLogin, handleLogout, handleTabChange,
          employeeList, employeeSearch, empPage, empTotal, selectedEmpRows,
          empModalShow, empModalTitle, empForm, empRules, empFormRef,
          loadEmployeeList, openEmpModal, editEmp, saveEmp, delEmp,
          batchEmpModalShow, batchEmpForm, batchEditEmp, saveBatchEmp, batchDelEmp,
          exportEmpExcel, exportEmpExcelTemplate, importEmpExcel,
          recruitList, recruitSearch, recPage, recTotal, selectedRecRows,
          recModalShow, recModalTitle, recForm, recRules, recFormRef,
          loadRecruitList, openRecModal, editRec, saveRec, delRec,
          batchRecModalShow, batchRecForm, batchEditRec, saveBatchRec, batchDelRec,
          exportRecExcel, exportRecExcelTemplate, importRecExcel,
          trainList, trainSearch, trainPage, trainTotal, selectedTrainRows,
          trainModalShow, trainModalTitle, trainForm, trainRules, trainFormRef,
          loadTrainList, handleEmpNameChange, openTrainModal, editTrain, saveTrain, delTrain,
          batchTrainModalShow, batchTrainForm, batchEditTrain, saveBatchTrain, batchDelTrain,
          exportTrainExcel, exportTrainExcelTemplate, importTrainExcel
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
